name: release

# A tag builds every release asset in one run: the Debian package, the Windows
# portable zip and installer, and the macOS .dmg.  The final job collects them
# into a *draft* release, so a person checks the names and the notes before
# pressing Publish.  GitHub adds the source zip and tar.gz itself.
#
# A manual run with an empty `tag` is the dry run: it builds the same assets and
# keeps them as workflow artifacts, but creates no release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v2.6.1; empty = build only'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Pinned so a new Typst release cannot change the PDFs under our feet.
  TYPST_VERSION: '0.15.1'

jobs:
  linux:
    name: Linux .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install Typst
        run: |
          curl -fsSL -o /tmp/typst.tar.xz \
            "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo install -m 0755 /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Create the Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install \
            -r src/gui/requirements.txt -r src/gui/requirements-build.txt
      - name: Build the .deb
        run: bash tools/build_deb.sh
      - name: Upload the .deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/prologd_*.deb

  windows:
    name: Windows portable and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Install Typst
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'typst.zip'
          Invoke-WebRequest -Uri (
            "https://github.com/typst/typst/releases/download/$env:TYPST_VERSION/typst-x86_64-pc-windows-msvc.zip"
          ) -OutFile $zip
          $root = Join-Path $env:RUNNER_TEMP 'typst'
          Expand-Archive -Path $zip -DestinationPath $root -Force
          $bin = Get-ChildItem $root -Directory | Select-Object -First 1
          $bin.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii
          $env:Path = "$($bin.FullName);$env:Path"
          typst --version
      # build_portable.ps1 runs `cmake --preset windows-msvc`, whose generator is
      # Visual Studio 18 2026.  The runner may still carry 2022, so the cache is
      # created here with whichever generator the image has; the script sees an
      # existing cache and only builds it.
      - name: Configure
        shell: pwsh
        run: |
          $help = cmake --help | Out-String
          $generator = @('Visual Studio 18 2026', 'Visual Studio 17 2022') |
            Where-Object { $help -match [regex]::Escape($_) } |
            Select-Object -First 1
          if (-not $generator) { throw 'no Visual Studio generator on this runner' }
          Write-Host "generator: $generator"
          cmake -S . -B build/windows-msvc -G $generator -A x64 -DBUILD_WITH_PROLOGD=ON
      - name: Create the Python environment
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r src/gui/requirements.txt -r src/gui/requirements-build.txt
      - name: Build the portable package
        shell: pwsh
        run: .\tools\build_portable.ps1 -Engine both
      - name: Build the installer
        shell: pwsh
        run: .\tools\build_installer.ps1 -SkipPackage
      - name: Upload the Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/prologd-*-win64.zip
            dist/prologd-*-setup.exe

  macos:
    name: macOS .dmg
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Toolchain
        run: |
          sw_vers
          uname -m
          cmake --version | head -n 1
          python3 --version
      - name: Install Typst
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install typst
      - name: Build the engines
        run: |
          cmake --preset macos-release -DBUILD_WITH_PROLOGD=ON
          cmake --build --preset macos-release
      - name: Build the manuals
        run: cmake --build --preset macos-release --target docs
      - name: Create the Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install \
            -r src/gui/requirements.txt -r src/gui/requirements-build.txt
      - name: Build the .icns
        run: |
          set -e
          mkdir -p build/PrologD.iconset
          src=src/gui/assets/prologd2.png
          sips -z 16 16 "$src" --out build/PrologD.iconset/icon_16x16.png >/dev/null
          sips -z 32 32 "$src" --out build/PrologD.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32 "$src" --out build/PrologD.iconset/icon_32x32.png >/dev/null
          sips -z 64 64 "$src" --out build/PrologD.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128 "$src" --out build/PrologD.iconset/icon_128x128.png >/dev/null
          sips -z 256 256 "$src" --out build/PrologD.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256 "$src" --out build/PrologD.iconset/icon_256x256.png >/dev/null
          sips -z 512 512 "$src" --out build/PrologD.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512 "$src" --out build/PrologD.iconset/icon_512x512.png >/dev/null
          sips -z 1024 1024 "$src" --out build/PrologD.iconset/icon_512x512@2x.png >/dev/null
          iconutil -c icns build/PrologD.iconset -o build/PrologD.icns
      - name: Freeze the window
        run: |
          .venv/bin/python -m PyInstaller --noconfirm --clean --onedir --windowed \
            --name PrologD --icon build/PrologD.icns \
            --osx-bundle-identifier com.csu.prologd \
            --add-data 'src/gui/assets:assets' --paths src/gui \
            --workpath build/pyinstaller --distpath dist \
            src/gui/main.py
      - name: Lay out the bundle
        run: |
          set -e
          version=$(build/macos-release/src/cli/prologu --version | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          test -n "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          app=dist/PrologD.app/Contents/MacOS
          test -d "$app"
          cp build/macos-release/src/cli/prologu "$app/"
          test -x build/macos-release/src/cli/prologd
          cp build/macos-release/src/cli/prologd "$app/"
          mkdir -p "$app/doc"
          cp doc/*.pdf doc/builtins.json "$app/doc/"
          cp -R examples stdlib "$app/"
          rm -rf "$app/examples/lessons/_old"
          python3 tools/macos_plist.py dist/PrologD.app/Contents/Info.plist "$version"
          plutil -lint dist/PrologD.app/Contents/Info.plist
          test "$(plutil -extract CFBundleShortVersionString raw dist/PrologD.app/Contents/Info.plist)" = "$version"
          for engine in prologu prologd; do
            test -x "$app/$engine"
            if otool -L "$app/$engine" | grep -q "$PWD/build/"; then
              echo "::error::$engine links the build tree"
              exit 1
            fi
          done
      - name: Sign and check
        run: |
          set -e
          codesign --force --deep --sign - dist/PrologD.app
          codesign --verify --deep --strict --verbose=2 dist/PrologD.app
          dist/PrologD.app/Contents/MacOS/prologu -s examples/lessons/lesson_01.pld >/dev/null
      - name: Make the .dmg
        run: |
          set -e
          mkdir -p build/dmg
          cp -R dist/PrologD.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname PrologD -srcfolder build/dmg -ov -format UDZO \
            "dist/PrologD-${VERSION}-arm64.dmg"
      - name: Upload the .dmg
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/PrologD-*-arm64.dmg

  release:
    name: Draft release
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check the tag and the asset names
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -e
          ls -lh dist
          version=$(basename dist/prologd_*.deb | sed -E 's/^prologd_(.+)_amd64\.deb$/\1/')
          test -n "$version"
          test "v$version" = "$TAG"
          for file in \
            "dist/prologd-${version}-win64.zip" \
            "dist/prologd-${version}-setup.exe" \
            "dist/PrologD-${version}-arm64.dmg"; do
            test -f "$file" || { echo "missing $file"; exit 1; }
          done
      - name: Create the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: dist/*
