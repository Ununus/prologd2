name: macos

# The engine had never been built on macOS before this workflow.  This job answers
# «does it compile and pass its tests there?» and «does the frozen window start?»
# on every push; the release workflow builds the `.dmg` (task_119).
#
# Prose only — `doc/`, `ai/`, markdown — compiles nothing here either, and a macOS
# runner is the slowest of the three to wait for (`ci.yml` says the same).
#
# The path filter applies to *any* push, a tag included: the docs say a `push` with
# both a branch/tag filter and a path filter runs only when both match, and a push
# with no changed files does not run at all.  A tag on a docs-only commit can
# therefore skip this workflow — and that is why `release.yml` carries no path
# filter whatsoever: a release always builds what it was tagged on.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'doc/**'
      - 'ai/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'doc/**'
      - 'ai/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job, not two.  The engine and the frozen window were separate jobs until
  # part 225, and that built the interpreter twice — once for `ctest`, once for
  # the bundle — for two runners doing the same configure and the same compile.
  # Both are still checked here, in the order that fails fastest: a red `ctest`
  # stops before PySide6 is downloaded, and the window is frozen only when the
  # engine it carries has passed its tests.
  #
  # `macos-15` is arm64; `macos-15-intel` is the x86_64 runner (`macos-14` is
  # deprecated).  The C++ engine is native-only until a universal build is decided
  # in task_119.
  macos:
    name: macOS (AppleClang, arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          uname -m
          cmake --version | head -n 1
          c++ --version | head -n 1
          python3 --version
      # Only the fetched *sources* are cached, never a build tree: a FetchContent
      # build directory carries absolute paths and its own CMake cache, and a stale
      # one is a failure that looks like a source problem.
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: |
            src/3rdparty/catch2-src
            src/3rdparty/cli11-src
            src/3rdparty/json-*
          key: fetchcontent-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt') }}
      - name: Configure
        run: cmake --preset macos-release
      - name: Build
        run: cmake --build --preset macos-release
      - name: Test
        run: ctest --preset macos-release

      # The window.  A frozen `.app` that cannot start dies silently when it is
      # double-clicked — a bounce in the dock, no dialog, no console — so the
      # bundle is laid out the way `release.yml` lays it out and asked to come up
      # (part 220; `--self-check` in `src/gui/main.py`).
      - name: Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install \
            -r src/gui/requirements.txt -r src/gui/requirements-build.txt
      - name: Freeze the window
        run: |
          .venv/bin/python -m PyInstaller --noconfirm --clean --onedir --windowed \
            --name PrologD --osx-bundle-identifier com.csu.prologd \
            --add-data 'src/gui/assets:assets' --paths src/gui \
            --workpath build/pyinstaller --distpath dist \
            src/gui/main.py
      - name: Lay out and sign the bundle
        run: |
          set -e
          app=dist/PrologD.app/Contents/MacOS
          test -d "$app"
          # `bin`, not `$app`: `PrologD` and `prologd` are one name on a Mac
          # filesystem, and the second copy would be what Finder runs (part 221).
          mkdir -p "$app/bin"
          cp build/macos-release/src/cli/prologd "$app/bin/"
          codesign --force --deep --sign - dist/PrologD.app
          codesign --verify --deep --strict --verbose=2 dist/PrologD.app
      - name: Start the window
        env:
          # The offscreen plugin has no font theme of its own, so Qt asks for its
          # generic «Sans Serif», builds a family-alias table and reports how long
          # it took.  That is about the harness, not about the window — a packaged
          # build takes its font from the system — so the one message is turned off
          # here instead of being explained on every run.
          QT_LOGGING_RULES: qt.qpa.fonts=false
        run: |
          set -e
          QT_QPA_PLATFORM=offscreen dist/PrologD.app/Contents/MacOS/PrologD --self-check \
            --settings "$RUNNER_TEMP/gui.ini"
