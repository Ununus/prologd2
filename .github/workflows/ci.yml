name: ci

# A push to `main` and a pull request are the two events that matter: an
# unfiltered `push` also ran for every branch, so a PR from a branch of this
# repository was built twice for the same commit.
#
# A change that touches only prose is not compiled: the manual, the journal and
# the markdown files are built by nothing here (the `docs` target runs on a
# release and in `macos.yml`'s packaging job), so `paths-ignore` keeps three
# platforms from spinning up for a typo in a lesson.  The filter has to be on
# `pull_request` as well — otherwise a docs-only PR would still start all of it.
# Such a PR reports no checks at all rather than a green tick, and with required
# status checks a docs-only PR would stay «pending» forever — `main` has no branch
# protection today, so nothing is blocked; if that ever changes, this filter has to
# go or the checks have to be made path-aware.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'doc/**'
      - 'ai/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'doc/**'
      - 'ai/**'
      - '**.md'

# A newer push to the same branch or PR cancels the run it supersedes — the older
# answer is about code nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only the fetched *sources* are cached, never a build tree: a FetchContent
      # build directory carries absolute paths and its own CMake cache, and a stale
      # one is a failure that looks like a source problem.  Ninja needs no install
      # step — the image already has it.
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: |
            src/3rdparty/catch2-src
            src/3rdparty/cli11-src
            src/3rdparty/json-*
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # A second C++ compiler, with the same warning list and `-Werror` on top.  Clang
  # reports a class of things GCC stays quiet about — an unused constant at
  # namespace scope, a private field nobody reads (`-Wunused-private-field` is a
  # Clang warning with no GCC twin) — and the only place those were being seen was
  # the macOS run, which is slow and only says so after a push to `main`.  Part 221
  # is what this job exists for: two such warnings were found by it and fixed.
  clang:
    name: Linux (Clang, warnings as errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: |
            src/3rdparty/catch2-src
            src/3rdparty/cli11-src
            src/3rdparty/json-*
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
      - name: Toolchain
        run: |
          clang++ --version | head -n 1
          cmake --version | head -n 1
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DPROLOGD_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: |
            src/3rdparty/catch2-src
            src/3rdparty/cli11-src
            src/3rdparty/json-*
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
      # ADR-013 targets MSVC 19.51 (Visual Studio 2026), and CMakePresets.json pins
      # that generator for a local build.  The runner image is another matter:
      # naming a generator it does not carry fails with «could not create named
      # generator» before a single file is compiled.  So the newest Visual Studio
      # the image has is taken, and the log says which one it was.
      - name: Configure
        shell: pwsh
        run: |
          $help = cmake --help | Out-String
          $generator = @('Visual Studio 18 2026', 'Visual Studio 17 2022') |
            Where-Object { $help -match [regex]::Escape($_) } |
            Select-Object -First 1
          if (-not $generator) { throw 'no Visual Studio generator on this runner' }
          Write-Host "generator: $generator"
          cmake -S . -B build -G $generator -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
